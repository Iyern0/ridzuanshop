</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script>
<!-- Build marker. Its only job is to answer "which shell is this browser
     actually running?" — the question a stale service-worker cache makes
     impossible to answer by looking. Because it is baked into the HTML, a
     cached shell shows the OLD number; a shell older than this marker shows
     nothing at all. Either way the answer is visible in one glance.
     Bump the number in the same commit as sw.js V. pointer-events:none and
     z-index below #cart-bar so it can never swallow a tap. -->
<div id="build-tag" style="position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:150;pointer-events:none;font-family:var(--fd);font-size:10px;font-weight:800;letter-spacing:0.5px;line-height:1;color:var(--muted);background:rgba(27,23,19,0.72);border:1px solid var(--line);border-radius:999px;padding:4px 8px;opacity:0.55">v50</div>
</body>
